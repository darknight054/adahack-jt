[project]
name = "street-miles-backend"
version = "0.1.0"
description = "Street Miles API: walk to Jane Street, earn breakfast"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    "tzdata>=2026.5",
]

[tool.uv]
package = false

# Vercel imports the app as a module, so the package's relative imports work.
[tool.vercel]
entrypoint = "app.main:app"
